name: CI

on:
  pull_request:
    branches: ['main', 'master']

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: stock_verifier
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U platform"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        env:
          SV_ENV: test
          DATABASE_URL: postgresql://platform:platform@localhost:5432/stock_verifier
          REDIS_URL: redis://localhost:6379/1
          JWT_ACCESS_SECRET: dev-access-secret-change-in-production
        run: pnpm typecheck

      - name: Build
        env:
          SV_ENV: test
          DATABASE_URL: postgresql://platform:platform@localhost:5432/stock_verifier
          REDIS_URL: redis://localhost:6379/1
          JWT_ACCESS_SECRET: dev-access-secret-change-in-production
        run: pnpm build

      - name: Tests
        env:
          SV_ENV: test
          DATABASE_URL: postgresql://platform:platform@localhost:5432/stock_verifier
          REDIS_URL: redis://localhost:6379/1
          JWT_ACCESS_SECRET: dev-access-secret-change-in-production
        run: pnpm test

